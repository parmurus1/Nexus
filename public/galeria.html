<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galeria — Nexus</title>
  <meta name="description" content="Fotos e vídeos da Nexus: shows ao vivo, bastidores e mais."/>
  <meta name="theme-color" content="#080808"/>
  <meta property="og:title" content="Galeria — Nexus"/>
  <meta property="og:description" content="Fotos e vídeos da Nexus: shows ao vivo, bastidores e mais."/>
  <meta property="og:image" content="https://nexus-rifa.vercel.app/imgs/marca/og-image.png"/>
  <meta property="og:type" content="website"/>
  <meta property="og:url" content="https://nexus-rifa.vercel.app/galeria"/>

  <link rel="apple-touch-icon" href="/imgs/marca/nexusicon-sm.png"/>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/nexus.css"/>

  <script defer src="/_vercel/insights/script.js"></script>
  <script src="/nexus-core.js"></script>
  <link rel="preconnect" href="https://i.ytimg.com"/>
  <style>
    /* ABAS */
    .tabs{display:flex;gap:6px;background:var(--bg2);border:1px solid var(--border);border-radius:999px;padding:5px;width:fit-content;margin:0 auto 40px;}
    .tab-btn{display:inline-flex;align-items:center;gap:8px;background:none;border:none;color:var(--text2);font-family:var(--f-mono);font-size:0.66rem;letter-spacing:0.12em;text-transform:uppercase;padding:10px 20px;border-radius:999px;cursor:pointer;transition:all var(--tr);}
    .tab-btn .ic{font-size:0.95rem;}
    .tab-btn:not(.on):hover{color:var(--text);}
    .tab-btn.on{background:var(--red);color:var(--on-red);}
    .tab-count{font-size:0.56rem;opacity:0.75;min-width:1.4em;}
    .tab-panel[hidden]{display:none;}

    /* FOTOS */
    .fotos-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
    @media(max-width:900px){.fotos-grid{grid-template-columns:repeat(3,1fr);}}
    @media(max-width:560px){.fotos-grid{grid-template-columns:repeat(2,1fr);gap:6px;}}
    .foto-card{position:relative;aspect-ratio:4/5;border-radius:var(--radius-sm);overflow:hidden;cursor:zoom-in;background:var(--bg2);border:1px solid var(--border);padding:0;transition:border-color var(--tr),transform var(--tr),box-shadow var(--tr);}
    .foto-card:hover{border-color:var(--border-s);transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,0.35);}
    .foto-card img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 0.6s cubic-bezier(0.2,0.7,0.2,1),opacity 0.4s;opacity:0;}
    .foto-card img.loaded{opacity:1;}
    .foto-card:hover img{transform:scale(1.05);}
    .foto-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,0.75) 0%,transparent 50%);opacity:0;transition:opacity var(--tr);display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:12px;text-align:left;}
    .foto-card:hover .foto-overlay,.foto-card:focus-visible .foto-overlay{opacity:1;}
    .foto-titulo{font-family:var(--f-cond);font-weight:600;font-size:0.9rem;color:#fff;letter-spacing:0.02em;line-height:1.2;}
    .foto-overlay .ic{color:#fff;font-size:1rem;flex-shrink:0;}
    @media(hover:none){.foto-overlay{opacity:1;background:linear-gradient(to top,rgba(0,0,0,0.6) 0%,transparent 40%);}.foto-overlay .ic{display:none;}}

    .mais-wrap{display:flex;justify-content:center;margin-top:28px;}

    /* VÍDEOS */
    .videos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
    @media(max-width:900px){.videos-grid{grid-template-columns:repeat(2,1fr);}}
    @media(max-width:560px){.videos-grid{grid-template-columns:1fr;}}
    .video-card{overflow:hidden;cursor:pointer;text-align:left;padding:0;color:inherit;display:flex;flex-direction:column;}
    .video-thumb{position:relative;aspect-ratio:16/9;background:var(--bg3);overflow:hidden;display:flex;align-items:center;justify-content:center;}
    .vt-bg{position:absolute;inset:-10%;width:120%;height:120%;object-fit:cover;filter:blur(18px) brightness(0.55);}
    .vt-fg{position:relative;height:100%;width:100%;object-fit:cover;transition:transform 0.6s cubic-bezier(0.2,0.7,0.2,1);}
    .vt-fg.vertical{width:auto;aspect-ratio:9/16;}
    .video-card:hover .vt-fg{transform:scale(1.04);}
    .video-play{position:absolute;z-index:2;width:54px;height:54px;border-radius:50%;background:var(--red);color:var(--on-red);display:flex;align-items:center;justify-content:center;font-size:1.25rem;box-shadow:0 6px 24px rgba(0,0,0,0.45);transition:transform var(--tr),background var(--tr);}
    .video-play .ic{margin-left:3px;}
    .video-card:hover .video-play{transform:scale(1.1);background:var(--red-hover);}
    .video-formato{position:absolute;z-index:2;top:10px;left:10px;}
    .video-body{padding:16px 18px 18px;}
    .video-titulo{font-family:var(--f-display);font-size:1.25rem;letter-spacing:0.03em;color:var(--text);line-height:1.15;}
    .video-desc{font-family:var(--f-mono);font-size:0.6rem;letter-spacing:0.06em;color:var(--text3);margin-top:6px;}

    /* MODAL DE VÍDEO */
    .video-ov{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,0.94);display:flex;align-items:center;justify-content:center;padding:64px 20px 24px;opacity:0;pointer-events:none;transition:opacity 0.25s;}
    .video-ov.open{opacity:1;pointer-events:all;}
    .video-modal{position:relative;width:100%;max-width:960px;display:flex;flex-direction:column;align-items:center;}
    .video-modal-x{position:fixed;top:16px;right:18px;}
    .video-frame{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:var(--radius);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.5);}
    .video-frame.vertical{width:auto;height:min(78vh,720px);aspect-ratio:9/16;max-width:100%;}
    .video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
    .video-modal-info{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;margin-top:16px;flex-wrap:wrap;}
    .video-frame.vertical + .video-modal-info{max-width:min(440px,100%);}
    .video-modal-titulo{font-family:var(--f-display);font-size:1.35rem;letter-spacing:0.03em;color:var(--text);}
    .video-modal-desc{font-family:var(--f-mono);font-size:0.6rem;letter-spacing:0.06em;color:var(--text3);margin-top:2px;}
  </style>
</head>
<body>

<a class="sr-only" href="#conteudo">Pular para o conteúdo</a>
<nav class="site-nav" aria-label="Principal">
  <a href="/" class="nav-logo" aria-label="Nexus, página inicial">
    <span class="nav-pulse" aria-hidden="true"></span>
    <img src="/imgs/marca/nexusicon-sm.png" alt="" width="22" height="32"/>
  </a>
  <div class="nav-links" id="navLinks">
    <a href="/sobre" class="nav-link">Sobre</a>
    <a href="/agenda" class="nav-link">Agenda</a>
    <a href="/galeria" class="nav-link">Galeria</a>
    <a href="/merch" class="nav-link">Merch</a>
    <a href="/contratantes" class="nav-link">Contratantes</a>
    <a href="/rifa" class="nav-link nav-rifa" data-rifa hidden><i data-icon="ticket"></i>Rifa</a>
  </div>
  <button class="nav-hamburger" id="navToggle" type="button" aria-label="Abrir menu" aria-controls="navLinks" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</nav>

<main id="conteudo">
<header class="page-hero">
  <div class="hero-orb"></div>
  <p class="page-eyebrow">Registros da banda</p>
  <h1 class="page-title">GALERIA</h1>
  <p class="page-sub">Fotos e vídeos da Nexus</p>
</header>

<div class="container">
  <div class="tabs" role="tablist" aria-label="Tipo de mídia">
    <button class="tab-btn on" id="tabFotos" role="tab" aria-selected="true" aria-controls="painelFotos" type="button" onclick="mudarAba('fotos')">
      <i data-icon="camera"></i>Fotos <span class="tab-count" id="countFotos"></span>
    </button>
    <button class="tab-btn" id="tabVideos" role="tab" aria-selected="false" aria-controls="painelVideos" type="button" onclick="mudarAba('videos')">
      <i data-icon="video"></i>Vídeos <span class="tab-count" id="countVideos"></span>
    </button>
  </div>

  <section class="tab-panel" id="painelFotos" role="tabpanel" aria-labelledby="tabFotos">
    <div class="fotos-grid" id="gridFotos">
      <div class="skeleton" style="aspect-ratio:4/5"></div><div class="skeleton" style="aspect-ratio:4/5"></div>
      <div class="skeleton" style="aspect-ratio:4/5"></div><div class="skeleton" style="aspect-ratio:4/5"></div>
    </div>
    <div class="mais-wrap" id="maisFotosWrap" hidden>
      <button class="btn btn-outline" type="button" onclick="mostrarMaisFotos()"><i data-icon="plus"></i>Carregar mais fotos</button>
    </div>
  </section>

  <section class="tab-panel" id="painelVideos" role="tabpanel" aria-labelledby="tabVideos" hidden>
    <div class="videos-grid" id="gridVideos"></div>
  </section>
</div>
</main>

<!-- MODAL DE VÍDEO -->
<div class="video-ov" id="videoOv" role="dialog" aria-modal="true" aria-label="Player de vídeo" onmousedown="nexusOverlayDown(event)" onclick="nexusOverlayClick(event,fecharVideo)">
  <button class="btn btn-icon video-modal-x" type="button" aria-label="Fechar vídeo" onclick="fecharVideo()"><i data-icon="x"></i></button>
  <div class="video-modal">
    <div class="video-frame" id="videoFrame"></div>
    <div class="video-modal-info">
      <div>
        <div class="video-modal-titulo" id="videoTitulo"></div>
        <div class="video-modal-desc" id="videoDesc"></div>
      </div>
      <a class="btn btn-outline btn-sm" id="videoLinkYt" href="#" target="_blank" rel="noopener"><i data-icon="youtube"></i>Abrir no YouTube</a>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="footer-logo">
    <img src="/imgs/marca/nexusicon-sm.png" alt="" width="15" height="22"/>
    <span>&copy; 2026 Nexus Band</span>
  </div>
  <div class="footer-social">
    <a href="https://instagram.com/nexus.bandbr" target="_blank" rel="noopener" aria-label="Instagram da Nexus"><i data-icon="instagram"></i></a>
    <a href="https://tiktok.com/@nexus.bandbr" target="_blank" rel="noopener" aria-label="TikTok da Nexus"><i data-icon="tiktok"></i></a>
    <a href="mailto:bandanexus01@gmail.com" aria-label="E-mail da Nexus"><i data-icon="mail"></i></a>
  </div>
  <span class="footer-credit">Desenvolvido por Murilo Neves Teixeira</span>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
// Usado enquanto a tabela "galeria" ainda não foi criada no Supabase,
// para a página nunca ficar vazia.
const GALERIA_PADRAO = [
  { tipo:'foto', titulo:'Ao vivo', url:'/imgs/shows/show-03.jpeg', thumbnail_url:'/imgs/shows/thumb/show-03.webp' },
  { tipo:'foto', titulo:'Ao vivo', url:'/imgs/shows/show-04.jpeg', thumbnail_url:'/imgs/shows/thumb/show-04.webp' },
  { tipo:'foto', titulo:'Ao vivo', url:'/imgs/shows/show-01.jpeg', thumbnail_url:'/imgs/shows/thumb/show-01.webp' },
  { tipo:'foto', titulo:'Ao vivo', url:'/imgs/shows/show-02.jpeg', thumbnail_url:'/imgs/shows/thumb/show-02.webp' },
  { tipo:'foto', titulo:'Ao vivo', url:'/imgs/shows/show-05.jpeg', thumbnail_url:'/imgs/shows/thumb/show-05.webp' },
  { tipo:'video', titulo:'Solo de bateria', descricao:'Senac Nações Unidas · 26.03.2026', url:'https://www.youtube.com/shorts/JECQqubB5Dc' },
  { tipo:'video', titulo:'Bodies', descricao:'Senac Nações Unidas · 26.03.2026', url:'https://www.youtube.com/shorts/_ElioiT5R8Q' },
  { tipo:'video', titulo:'Debil Metal', descricao:'Senac Nações Unidas · 30.10.2025', url:'https://www.youtube.com/shorts/93pcz_6b-JM' },
  { tipo:'video', titulo:'Toxicity', descricao:'Senac Nações Unidas · 26.03.2026', url:'https://www.youtube.com/shorts/o3ycjRGmkhc' }
];
const POR_PAGINA = 24;

let fotos = [], videos = [], fotosVisiveis = POR_PAGINA;

function idYoutube(url){
  const m = String(url || '').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}
const ehShort = url => /\/shorts\//.test(url || '');

async function carregarGaleria(){
  let itens = null;
  try{
    const res = await fetch('/api/galeria');
    if(res.ok){
      const d = await res.json();
      if(!d.aviso) itens = d.itens || [];
    }
  }catch(e){}
  if(itens === null) itens = GALERIA_PADRAO;
  fotos = itens.filter(i => i.tipo === 'foto' && i.url);
  videos = itens.filter(i => i.tipo === 'video' && idYoutube(i.url));
  document.getElementById('countFotos').textContent = fotos.length || '';
  document.getElementById('countVideos').textContent = videos.length || '';
  renderFotos();
  renderVideos();
}

function mudarAba(aba, semHash){
  const ehFotos = aba === 'fotos';
  [['tabFotos', ehFotos], ['tabVideos', !ehFotos]].forEach(([id, on]) => {
    const b = document.getElementById(id);
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', on ? 'true' : 'false');
  });
  document.getElementById('painelFotos').hidden = !ehFotos;
  document.getElementById('painelVideos').hidden = ehFotos;
  if(!semHash) history.replaceState(null, '', '#' + aba);
}

function estadoVazio(icone, titulo, texto){
  return `<div class="state">${nexusIcon(icone)}<span class="state-title">${titulo}</span><span>${texto}</span></div>`;
}

function renderFotos(){
  const grid = document.getElementById('gridFotos');
  if(!fotos.length){
    grid.innerHTML = estadoVazio('camera', 'Nenhuma foto ainda', 'Volte em breve para ver os registros dos shows.');
    document.getElementById('maisFotosWrap').hidden = true;
    return;
  }
  grid.innerHTML = fotos.slice(0, fotosVisiveis).map((f, i) => `
    <button class="foto-card" type="button" onclick="abrirFoto(${i})" aria-label="Ampliar foto${f.titulo ? ': ' + nexusEsc(f.titulo) : ''}">
      <img src="${nexusEsc(f.thumbnail_url || f.url)}" alt="${nexusEsc(f.titulo || 'Foto da Nexus')}" loading="lazy" decoding="async" onload="this.classList.add('loaded')" onerror="this.classList.add('loaded')"/>
      <span class="foto-overlay">
        <span class="foto-titulo">${nexusEsc(f.titulo || '')}</span>
        ${nexusIcon('zoom-in')}
      </span>
    </button>`).join('');
  document.getElementById('maisFotosWrap').hidden = fotos.length <= fotosVisiveis;
}

function mostrarMaisFotos(){
  fotosVisiveis += POR_PAGINA;
  renderFotos();
}

function abrirFoto(i){
  nexusLightbox(fotos.map(f => ({
    src: f.url,
    cap: [f.titulo, f.descricao].filter(Boolean).join(' · ')
  })), i);
}

function renderVideos(){
  const grid = document.getElementById('gridVideos');
  if(!videos.length){
    grid.innerHTML = estadoVazio('video', 'Nenhum vídeo ainda', 'Volte em breve para ver os vídeos dos shows.');
    return;
  }
  grid.innerHTML = videos.map((v, i) => {
    const id = idYoutube(v.url);
    const thumb = `https://i.ytimg.com/vi/${id}/hqdefault.jpg`;
    const vertical = ehShort(v.url);
    return `
    <button class="card card-hover video-card" type="button" onclick="abrirVideo(${i})" aria-label="Assistir: ${nexusEsc(v.titulo || 'vídeo')}">
      <span class="video-thumb">
        <img class="vt-bg" src="${thumb}" alt="" onerror="this.style.visibility='hidden'" loading="lazy" decoding="async"/>
        <img class="vt-fg${vertical ? ' vertical' : ''}" src="${thumb}" alt="" onerror="this.style.visibility='hidden'" loading="lazy" decoding="async"/>
        <span class="video-play">${nexusIcon('play')}</span>
        ${vertical ? `<span class="tag tag-muted video-formato" style="background:rgba(0,0,0,0.6);color:#fff;">Shorts</span>` : ''}
      </span>
      <span class="video-body">
        <span class="video-titulo" style="display:block;">${nexusEsc(v.titulo || 'Vídeo')}</span>
        ${v.descricao ? `<span class="video-desc" style="display:block;">${nexusEsc(v.descricao)}</span>` : ''}
      </span>
    </button>`;
  }).join('');
}

function abrirVideo(i){
  const v = videos[i];
  const id = v && idYoutube(v.url);
  if(!id) return;
  const frame = document.getElementById('videoFrame');
  frame.classList.toggle('vertical', ehShort(v.url));
  // youtube-nocookie: não grava cookies de rastreio até o visitante dar play
  frame.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&playsinline=1" title="${nexusEsc(v.titulo || 'Vídeo da Nexus')}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>`;
  document.getElementById('videoTitulo').textContent = v.titulo || '';
  document.getElementById('videoDesc').textContent = v.descricao || '';
  document.getElementById('videoLinkYt').href = v.url;
  document.getElementById('videoOv').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function fecharVideo(){
  document.getElementById('videoOv').classList.remove('open');
  document.getElementById('videoFrame').innerHTML = ''; // para o vídeo ao fechar
  document.body.style.overflow = '';
}

document.addEventListener('keydown', ev => {
  if(ev.key === 'Escape' && document.getElementById('videoOv').classList.contains('open')) fecharVideo();
});

// Aba inicial pelo link (/galeria#videos abre direto nos vídeos)
if(location.hash === '#videos') mudarAba('videos', true);
carregarGaleria();
</script>
<script src="/venom.js" defer></script>
</body>
</html>
