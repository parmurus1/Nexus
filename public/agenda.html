  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;500;600&family=Barlow+Condensed:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/nexus.css"/>

  <script defer src="/_vercel/insights/script.js"></script>
  <script src="/nexus-core.js"></script>
  <style>
    .shows-list{display:flex;flex-direction:column;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
    .show-item{background:var(--bg2);padding:30px 34px;display:grid;grid-template-columns:120px 1fr auto;align-items:center;gap:28px;transition:background var(--tr);}
    .show-item:hover{background:var(--bg3);}
    .show-item.passado{opacity:0.6;}
    .show-item.passado:hover{opacity:0.85;}
    .show-data{text-align:center;border-right:1px solid var(--border-s);padding-right:24px;}
    .show-dia{font-family:var(--f-display);font-size:4rem;line-height:0.95;color:var(--text);letter-spacing:0.02em;text-shadow:0 0 30px var(--red-glow);}
    .show-mes{font-family:var(--f-display);font-size:1.15rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--red);margin-top:2px;}
    .show-ano{font-family:var(--f-mono);font-size:0.68rem;letter-spacing:0.1em;color:var(--text3);margin-top:4px;}
    .show-nome{font-family:var(--f-display);font-size:clamp(1.7rem,3.4vw,2.4rem);letter-spacing:0.03em;line-height:1.05;color:var(--text);margin-bottom:10px;}
    .show-meta{display:flex;flex-direction:column;gap:5px;}
    .show-meta span{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-cond);font-weight:600;font-size:1.02rem;color:var(--text);letter-spacing:0.02em;}
    .show-meta span.sec{color:var(--text2);font-size:0.95rem;}
    .show-meta .ic{color:var(--text3);font-size:0.95rem;}
    .show-acao{margin-top:14px;}
    .show-gratis{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-weight:500;font-size:0.72rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--ok);}
    @media(max-width:640px){
      .show-item{grid-template-columns:84px 1fr;gap:18px;padding:22px 18px;}
      .show-data{padding-right:14px;}
      .show-dia{font-size:3rem;}
      .show-item>.tag{grid-column:2;justify-self:start;margin-top:-6px;}
    }
  </style>
</head>
<body>

<a class="sr-only" href="#conteudo">Pular para o conteúdo</a>
<nav class="site-nav" aria-label="Principal">
  <a href="/" class="nav-logo" aria-label="Nexus, página inicial">
    <span class="nav-pulse" aria-hidden="true"></span>
    <img src="/imgs/marca/nexusicon-sm.png" alt="" width="22" height="32"/>
  </a>
  <div class="nav-links" id="navLinks">
    <a href="/sobre" class="nav-link">Sobre</a>
    <a href="/agenda" class="nav-link">Agenda</a>
    <a href="/galeria" class="nav-link">Galeria</a>
    <a href="/merch" class="nav-link">Merch</a>
    <a href="/contratantes" class="nav-link">Contratantes</a>
    <a href="/rifa" class="nav-link nav-rifa" data-rifa hidden><i data-icon="ticket"></i>Rifa</a>
  </div>
  <button class="nav-hamburger" id="navToggle" type="button" aria-label="Abrir menu" aria-controls="navLinks" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
</nav>

<main id="conteudo">
<header class="page-hero">
  <div class="hero-orb right"></div>
  <p class="page-eyebrow">Ao vivo</p>
  <h1 class="page-title">AGENDA</h1>
  <p class="page-sub">Onde a Nexus vai tocar</p>
</header>

<div class="container container-narrow">
  <section class="section">
    <p class="sec-eyebrow">Próximos shows</p>
    <h2 class="sec-title">EM BREVE</h2>
    <div id="proximosWrap"><div class="state plain"><span class="spinner"></span>Carregando agenda...</div></div>
  </section>

  <section class="section">
    <p class="sec-eyebrow">Histórico</p>
    <h2 class="sec-title">SHOWS PASSADOS</h2>
    <div id="passadosWrap"><div class="state plain"><span class="spinner"></span>Carregando...</div></div>
  </section>
</div>
</main>

<footer class="site-footer">
  <div class="footer-logo">
    <img src="/imgs/marca/nexusicon-sm.png" alt="" width="15" height="22"/>
    <span>&copy; 2026 Nexus Band</span>
  </div>
  <div class="footer-social">
    <a href="https://instagram.com/nexus.bandbr" target="_blank" rel="noopener" aria-label="Instagram da Nexus"><i data-icon="instagram"></i></a>
    <a href="https://tiktok.com/@nexus.bandbr" target="_blank" rel="noopener" aria-label="TikTok da Nexus"><i data-icon="tiktok"></i></a>
    <a href="mailto:bandanexus01@gmail.com" aria-label="E-mail da Nexus"><i data-icon="mail"></i></a>
  </div>
  <span class="footer-credit">Desenvolvido por Murilo Neves Teixeira</span>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const MESES = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
const HOJE = new Date(); HOJE.setHours(0, 0, 0, 0);

const dataShow = s => s.data ? new Date(s.data + 'T12:00:00') : null;
// Show com data no passado conta como realizado, mesmo que ninguém tenha
// marcado no painel — evita "Em breve" para um show que já aconteceu.
function statusEfetivo(s){
  const d = dataShow(s);
  if(s.status === 'cancelado') return 'cancelado';
  if(s.status === 'realizado' || (d && d < HOJE)) return 'realizado';
  return 'breve';
}

const TAGS = {
  breve:     '<span class="tag tag-ok">Em breve</span>',
  realizado: '<span class="tag tag-muted">Realizado</span>',
  cancelado: '<span class="tag tag-accent">Cancelado</span>'
};

function renderShow(s){
  const d = dataShow(s);
  const status = statusEfetivo(s);
  const futuro = status === 'breve';
  let acao = '';
  if(futuro){
    acao = (s.gratuito || !s.link)
      ? `<span class="show-gratis">${nexusIcon('check-circle')}Entrada gratuita</span>`
      : `<a href="${nexusEsc(s.link)}" target="_blank" rel="noopener" class="btn btn-primary btn-sm">${nexusIcon('ticket')}Ingressos</a>`;
  }
  return `
  <article class="show-item${futuro ? '' : ' passado'}">
    <div class="show-data">
      <div class="show-dia">${d ? String(d.getDate()).padStart(2, '0') : '--'}</div>
      <div class="show-mes">${d ? MESES[d.getMonth()] : '---'}</div>
      <div class="show-ano">${d ? d.getFullYear() : ''}</div>
    </div>
    <div>
      <h3 class="show-nome">${nexusEsc(s.nome)}</h3>
      <div class="show-meta">
        <span>${nexusIcon('map-pin')}${nexusEsc(s.local || 'Local a confirmar')}</span>
        ${s.hora ? `<span class="sec">${nexusIcon('clock')}${nexusEsc(s.hora)}</span>` : ''}
      </div>
      ${acao ? `<div class="show-acao">${acao}</div>` : ''}
    </div>
    ${TAGS[status]}
  </article>`;
}

function lista(shows, vazioIcone, vazioTitulo, vazioTexto){
  return shows.length
    ? '<div class="shows-list">' + shows.map(renderShow).join('') + '</div>'
    : `<div class="state">${nexusIcon(vazioIcone)}<span class="state-title">${vazioTitulo}</span><span>${vazioTexto}</span></div>`;
}

async function carregarAgenda(){
  let shows = [], erro = false;
  try{
    const r = await fetch('/api/shows');
    if(r.ok){ const d = await r.json(); shows = d.shows || []; } else erro = true;
  }catch{ erro = true; }

  if(erro){
    const msg = `<div class="state">${nexusIcon('alert')}<span>Não foi possível carregar a agenda agora. Tente recarregar a página.</span></div>`;
    document.getElementById('proximosWrap').innerHTML = msg;
    document.getElementById('passadosWrap').innerHTML = '';
    return;
  }

  // Próximos: ordem manual definida no painel admin. Passados: mais recentes primeiro.
  const proximos = shows.filter(s => statusEfetivo(s) === 'breve');
  const passados = shows.filter(s => statusEfetivo(s) !== 'breve')
    .sort((a, b) => String(b.data || '').localeCompare(String(a.data || '')));

  document.getElementById('proximosWrap').innerHTML =
    lista(proximos, 'calendar', 'Nenhum show agendado', 'Siga a Nexus no Instagram para saber das próximas datas.');
  document.getElementById('passadosWrap').innerHTML =
    lista(passados, 'clock', 'Sem histórico ainda', 'Os shows realizados aparecem aqui.');
}

carregarAgenda();
</script>
<script src="/venom.js" defer></script>
</body>
</html>
